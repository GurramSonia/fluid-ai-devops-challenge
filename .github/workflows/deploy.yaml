name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker version

      - name: Check Kubernetes
        run: kubectl get nodes

      - name: Check Python
        run: py --version

      - name: Install Python dependencies
        run: py -m pip install -r app/requirements.txt

      - name: Run application tests
        run: py -m pytest -v

      - name: Build Docker image
        run: docker build --progress=plain -t fluid-ai-backend:${{ github.sha }} ./app
      
      - name: Check Trivy
        run: trivy --version
      
      - name: Scan Docker image with Trivy
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed fluid-ai-backend:${{ github.sha }}

      - name: Deploy PostgreSQL
        run: kubectl apply -f k8s/secret.yaml -f k8s/configmap.yaml -f k8s/postgres.yaml

      - name: Deploy Backend
        run: kubectl apply -f k8s/backend.yaml

      - name: Update Backend Image
        run: kubectl set image deployment/backend backend=fluid-ai-backend:${{ github.sha }}

      - name: Wait for rollout
        run: kubectl rollout status deployment/backend --timeout=120s

      - name: Verify Kubernetes deployment
        run: kubectl get pods